<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Swivra</title>
<link rel="stylesheet" href="wheel.css">
</head>
<body>
<div id="wheel" class="wheel hidden" aria-hidden="true">
  <div id="glass" class="glass"></div>
  <div class="rim"></div>
  <div class="ring"></div>
  <div class="radar"></div>
  <div id="slices"></div>
  <div id="light" class="light"></div>
  <div id="labels"></div>
  <div class="center">
    <div id="badge" class="badge"></div>
    <span id="center-title" class="center-title"></span>
    <span id="center-sub" class="center-sub"></span>
    <span id="center-hint" class="center-hint"></span>
  </div>
</div>
<div id="panel" class="panel hidden" role="dialog">
  <div class="pglass"></div>
  <div id="panel-light" class="panel-light"></div>
  <div id="crop-body" class="panel-body" aria-label="Kırp" data-tr-label="Kırp" data-en-label="Crop" hidden>
    <div class="panel-head">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path class="ico" d="M6 2v16h16 M2 6h16v16"></path></svg>
      <span class="panel-title" data-tr="Kırp" data-en="Crop">Kırp</span>
      <span id="crop-file" class="panel-file"></span>
      <div id="crop-presets" class="presets"></div>
    </div>
    <div class="stage-row">
      <div id="stage" class="stage">
        <img id="crop-img" alt="">
        <div id="crop-rect" class="crop-rect">
          <i class="third v1"></i><i class="third v2"></i><i class="third h1"></i><i class="third h2"></i>
          <b class="hd nw" data-h="nw"></b><b class="hd ne" data-h="ne"></b><b class="hd sw" data-h="sw"></b><b class="hd se" data-h="se"></b>
          <b class="hd n edge" data-h="n"></b><b class="hd s edge" data-h="s"></b><b class="hd w edge" data-h="w"></b><b class="hd e edge" data-h="e"></b>
        </div>
      </div>
    </div>
    <div class="panel-foot">
      <span id="crop-info" class="panel-info"></span>
      <div class="buttons">
        <button id="crop-cancel" class="btn" data-tr="Vazgeç" data-en="Cancel">Vazgeç</button>
        <button id="crop-apply" class="btn primary" data-tr="Kırp ve kaydet" data-en="Crop and save">Kırp ve kaydet</button>
      </div>
    </div>
  </div>
  <div id="lock-body" class="panel-body" aria-label="Şifrele" data-tr-label="Şifrele" data-en-label="Lock" hidden>
    <div class="panel-head">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path class="ico" d="M6 11h12v9H6z M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      <span class="panel-title" data-tr="Şifrele" data-en="Lock">Şifrele</span>
      <span id="lock-file" class="panel-file"></span>
    </div>
    <div class="lock-content">
      <div class="field">
        <input id="lock-pw" type="password" autocomplete="off" spellcheck="false" maxlength="128" placeholder="Parola" data-tr-placeholder="Parola" data-en-placeholder="Password" aria-label="Parola" data-tr-label="Parola" data-en-label="Password">
        <button id="lock-eye" class="eye" type="button" aria-label="Parolayı göster" data-tr-label="Parolayı göster" data-en-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path id="lock-eye-path" class="ico" d=""></path></svg>
        </button>
      </div>
      <span id="lock-hint" class="lock-hint"></span>
    </div>
    <div class="panel-foot">
      <span id="lock-info" class="panel-info"></span>
      <div class="buttons">
        <button id="lock-cancel" class="btn" data-tr="Vazgeç" data-en="Cancel">Vazgeç</button>
        <button id="lock-apply" class="btn primary" data-tr="Şifrele" data-en="Lock">Şifrele</button>
      </div>
    </div>
  </div>
  <div id="tel-body" class="panel-body" aria-label="Telefona" data-tr-label="Telefona" data-en-label="To phone" hidden>
    <div class="panel-head">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path class="ico" d="M8 3h8v18H8z M11 18h2"></path></svg>
      <span class="panel-title" data-tr="Telefona" data-en="To phone">Telefona</span>
      <span id="tel-file" class="panel-file"></span>
    </div>
    <div class="tel-content">
      <div class="qr"><img id="tel-qr" alt="QR"></div>
      <div class="tel-side">
        <b class="tel-step" data-tr="Telefonun kamerasıyla QR kodu okut" data-en="Scan the QR code with your phone camera">Telefonun kamerasıyla QR kodu okut</b>
        <span class="tel-note" data-tr="Telefonun aynı Wi-Fi'da olmalı" data-en="Your phone must be on the same Wi-Fi">Telefonun aynı Wi-Fi'da olmalı</span>
        <span id="tel-url" class="tel-url"></span>
        <span id="tel-count" class="tel-count"></span>
        <span id="tel-minutes" class="tel-note"></span>
      </div>
    </div>
    <div class="panel-foot">
      <span id="tel-info" class="panel-info"></span>
      <div class="buttons">
        <button id="tel-close" class="btn primary" data-tr="Kapat" data-en="Close">Kapat</button>
      </div>
    </div>
  </div>
</div>
<script src="wheel.js"></script>
</body>
</html>
